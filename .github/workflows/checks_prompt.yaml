name: checks_prompt

on:
  pull_request:
  push:
    branches: [w2-lab-day-1]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: w02-prompt-lab/w02-prompt-lab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --frozen
      - run: uv run ruff check src/promptlab/usage.py src/promptlab/day1.py src/promptlab/day2.py src/promptlab/errors.py src/promptlab/adapters
      - run: uv run mypy src/promptlab/usage.py src/promptlab/day1.py src/promptlab/day2.py src/promptlab/errors.py src/promptlab/adapters
      - run: uv run pytest